# DAST – OWASP ZAP contra staging (SRS 8.2). Semanal y manual.
# Secreto requerido: STAGING_URL (p. ej. https://staging.tu-clinica.ec)
name: DAST

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1' # lunes 03:00 Ecuador

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline (frontend)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.STAGING_URL }}
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
      - name: ZAP API scan (OpenAPI)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: ${{ secrets.STAGING_URL }}/api/docs-json
          format: openapi
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
