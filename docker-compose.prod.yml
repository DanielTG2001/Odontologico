# SIGO-Dental – despliegue de producción (RNF-02 disponibilidad, RNF-03 concurrencia)
#
#   cp deploy/.env.prod.example .env.prod   # completar secretos
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# - 2 réplicas de la API detrás de nginx (si una cae o se redepliega, la otra atiende)
# - nginx con TLS 1.3 (RNF-04), HTTP/2, gzip, rate limit en login y failover entre réplicas
# - healthchecks + restart automático en todos los servicios
# - backup diario de PostgreSQL con retención

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sigo_dental}
    # max_connections > (réplicas × connection_limit) + margen
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "log_min_duration_statement=500"]
    volumes:
      - pg_data:/var/lib/postgresql/data   # montar sobre un volumen cifrado (LUKS / disco cifrado del proveedor) – RNF-04
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sigo_dental}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10

  minio:
    <<: *restart
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

  # Aplica migraciones una vez antes de arrancar la API
  migrate:
    build: ./backend
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *restart
    build: ./backend
    env_file: .env.prod
    environment:
      NODE_ENV: production
      FRONTEND_URL: https://${DOMAIN}
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 768M }
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    <<: *restart
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    deploy:
      replicas: 2
    depends_on: [api]

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/nginx/sigo.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on: [api, web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s

  backup:
    <<: *restart
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-sigo_dental}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:
